name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
      # Release on every push: merge the release PR right away. A merge made with
      # GITHUB_TOKEN doesn't trigger a new workflow run, so tag it in this job.
      - if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ fromJSON(steps.rp.outputs.pr).number }}" --squash --repo "$GITHUB_REPOSITORY"
      - if: steps.rp.outputs.pr
        uses: googleapis/release-please-action@v4
