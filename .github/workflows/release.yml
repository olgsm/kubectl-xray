name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rp.outputs.tag_name || steps.tag.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
      # Release on every push: merge the release PR right away. A merge made with
      # GITHUB_TOKEN doesn't trigger a new workflow run, so tag it in this job.
      - if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ fromJSON(steps.rp.outputs.pr).number }}" --squash --repo "$GITHUB_REPOSITORY"
      - if: steps.rp.outputs.pr
        uses: googleapis/release-please-action@v4
        id: tag

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
